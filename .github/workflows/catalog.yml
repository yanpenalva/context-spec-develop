name: Publish CSD catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: catalog
      - id: deployment
        uses: actions/deploy-pages@v5
